<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mental Health &amp; Wellness App</title>
    <style>
      :root {
        --green-100: #b9f1d0;
        --green-600: #2e9d5f;
        --green-700: #237a49;
        --yellow: #fff1b8;
        --blue: #d4ebff;
        --purple: #e1d9ff;
        --red: #ffd3d3;
        --red-strong: #f0626b;
        --ink: #1d2b26;
        --muted: #5d6b66;
        --line: #d9e4df;
        --bg: #f4f8f6;
        --card: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.45;
      }
      #app {
        min-height: 100vh;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      header.top {
        background: var(--green-100);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        position: relative;
      }
      header.top .logo {
        font-size: 26px;
      }
      header.top h1 {
        font-size: 15px;
        line-height: 1.15;
        margin: 0;
        flex: 1;
      }
      .menu-btn {
        background: none;
        border: 0;
        font-size: 26px;
        cursor: pointer;
        color: var(--ink);
      }
      .menu {
        position: absolute;
        right: 12px;
        top: 54px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        min-width: 190px;
        z-index: 5;
        display: none;
      }
      .menu.open {
        display: block;
      }
      .menu div {
        padding: 10px 14px;
        font-size: 14px;
        color: var(--muted);
      }
      .menu button {
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        background: none;
        border: 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
        font-size: 15px;
      }
      main {
        flex: 1;
        padding: 20px 16px 90px;
        min-width: 0;
      }
      .shell {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .content {
        max-width: 1000px;
        margin: 0 auto;
        width: 100%;
      }
      .content.wide {
        max-width: 1250px;
      }
      .shell main {
        flex: 1;
      }
      h2 {
        margin: 4px 0 4px;
        font-size: 26px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .mood-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 14px 0;
      }
      .mood {
        border: 3px solid transparent;
        border-radius: 14px;
        padding: 18px 8px;
        text-align: center;
        font-weight: 600;
        cursor: pointer;
        font-size: 16px;
        font-family: inherit;
      }
      .mood .em {
        display: block;
        font-size: 38px;
        margin-bottom: 4px;
      }
      .mood.happy {
        background: var(--yellow);
      }
      .mood.okay {
        background: var(--blue);
      }
      .mood.sad {
        background: var(--purple);
      }
      .mood.stressed {
        background: var(--red);
      }
      .mood.selected {
        border-color: var(--green-700);
        box-shadow: 0 0 0 3px rgba(46, 157, 95, 0.25);
      }
      label {
        display: block;
        font-weight: 600;
        margin: 12px 0 6px;
      }
      textarea,
      input[type="text"],
      input[type="password"],
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #b8c8c1;
        border-radius: 10px;
        font: inherit;
        background: #fff;
      }
      textarea {
        min-height: 130px;
        resize: vertical;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0;
        font-weight: 600;
      }
      .check input {
        width: 22px;
        height: 22px;
      }
      .btn {
        display: block;
        width: 100%;
        padding: 15px;
        border: 0;
        border-radius: 12px;
        background: var(--green-600);
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 14px;
        font-family: inherit;
      }
      .btn:hover {
        background: var(--green-700);
      }
      .btn.small {
        display: inline-block;
        width: auto;
        padding: 8px 14px;
        font-size: 14px;
        margin: 0;
      }
      .btn.ghost {
        background: #fff;
        color: var(--green-700);
        border: 2px solid var(--green-600);
      }
      .btn.danger {
        background: var(--red-strong);
      }
      nav.bottom {
        position: sticky;
        bottom: 0;
        z-index: 4;
        background: #fff;
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        padding: 6px;
      }
      nav.bottom button {
        background: none;
        border: 0;
        padding: 8px 0;
        border-radius: 12px;
        cursor: pointer;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--muted);
        font-family: inherit;
      }
      nav.bottom button span {
        display: block;
        font-size: 22px;
      }
      nav.bottom button.active {
        background: var(--green-100);
        color: var(--green-700);
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin: 10px 0;
        background: #fff;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin: 10px 0;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
      }
      .item .ic {
        font-size: 24px;
      }
      .item .chev {
        margin-left: auto;
        color: var(--muted);
      }
      .item.tip {
        background: #dff7e8;
      }
      .item.act {
        background: var(--purple);
      }
      .item.info {
        background: var(--blue);
      }
      .hotline {
        background: var(--red);
        border-radius: 14px;
        padding: 16px;
        margin-top: 16px;
      }
      .hotline h3 {
        margin: 0 0 4px;
      }
      .hotline .num {
        font-size: 22px;
        font-weight: 800;
        margin: 8px 0;
      }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 700;
      }
      .pill.new {
        background: var(--yellow);
      }
      .pill.rev {
        background: var(--blue);
      }
      .pill.fu {
        background: var(--red);
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 120px;
        margin: 10px 0 4px;
      }
      .bars div {
        flex: 1;
        border-radius: 6px 6px 0 0;
        min-height: 6px;
        position: relative;
      }
      .bars small {
        position: absolute;
        bottom: -20px;
        left: 0;
        right: 0;
        text-align: center;
        color: var(--muted);
        font-size: 11px;
      }
      .bars-wrap {
        padding-bottom: 22px;
      }
      .list-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .list-row:last-child {
        border: 0;
      }
      .list-row .em {
        font-size: 26px;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .login {
        padding: 30px 22px;
        max-width: 460px;
        margin: 0 auto;
        width: 100%;
      }
      .login .logo {
        font-size: 52px;
        text-align: center;
      }
      .login h2 {
        text-align: center;
        font-size: 22px;
      }
      .demo {
        background: var(--bg);
        border: 1px dashed #9db3a9;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        margin-top: 18px;
      }
      .err {
        color: #b3262f;
        font-weight: 600;
        margin-top: 10px;
        min-height: 20px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 90px;
        transform: translateX(-50%) translateY(30px);
        background: #1d2b26;
        color: #fff;
        padding: 12px 18px;
        border-radius: 99px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
        z-index: 20;
        max-width: 90vw;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        background: var(--bg);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin: 14px 0;
      }
      .stat {
        background: var(--bg);
        border-radius: 12px;
        padding: 14px;
      }
      .stat b {
        font-size: 26px;
        display: block;
      }
      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .filters button {
        padding: 8px 14px;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
      }
      .filters button.active {
        background: var(--green-600);
        color: #fff;
        border-color: var(--green-600);
      }
      .breath {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: var(--green-100);
        margin: 20px auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        text-align: center;
        transition: transform 4s ease-in-out;
      }
      .breath.in {
        transform: scale(1.35);
      }
      .back {
        background: none;
        border: 0;
        color: var(--green-700);
        font-weight: 700;
        cursor: pointer;
        font-size: 15px;
        padding: 0 0 8px;
        font-family: inherit;
      }
      main.clinic {
        padding-bottom: 30px;
      }
      @media (max-width: 700px) {
        table.resp thead {
          display: none;
        }
        table.resp tr {
          display: block;
          border: 1px solid var(--line);
          border-radius: 10px;
          margin: 10px 0;
        }
        table.resp td {
          display: block;
          border: 0;
          padding: 6px 10px;
        }
      }

      .who {
        font-size: 14px;
        font-weight: 600;
        margin-right: 4px;
        display: none;
      }
      .grid2 {
        display: grid;
        gap: 18px;
        grid-template-columns: 1fr;
      }
      .grid2 h3 {
        margin: 12px 0 6px;
      }
      .res-grid {
        display: grid;
        gap: 0 14px;
        grid-template-columns: 1fr;
      }
      .nudge {
        background: #fff4d6;
        border: 1px solid #f0d58a;
        border-radius: 12px;
        padding: 12px 14px;
        margin: 10px 0;
      }
      .nudge a {
        color: var(--green-700);
        font-weight: 700;
      }
      .nudge.ok {
        background: #dff7e8;
        border-color: #9bdcb7;
      }
      .tipcard {
        background: #eef9f2;
      }
      .big {
        font-size: 26px;
        font-weight: 800;
      }
      .check.small {
        font-weight: 500;
        margin: 8px 0;
      }
      .check.small input {
        width: 20px;
        height: 20px;
      }
      .reply {
        background: #eef9f2;
        border-left: 4px solid var(--green-600);
        padding: 8px 10px;
        margin-top: 8px;
        border-radius: 6px;
        font-size: 14px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .row input {
        flex: 1;
      }
      .pre {
        white-space: pre-line;
      }
      .hbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 7px 0;
        font-size: 14px;
      }
      .hbar span {
        width: 100px;
      }
      .hbar div {
        flex: 1;
        background: var(--bg);
        border-radius: 99px;
        height: 12px;
        overflow: hidden;
      }
      .hbar i {
        display: block;
        height: 100%;
        border-radius: 99px;
      }
      .hbar b {
        width: 28px;
        text-align: right;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        margin: 12px 0;
      }
      .toolbar .filters {
        margin: 0;
      }
      .toolbar input {
        max-width: 280px;
      }
      details summary {
        cursor: pointer;
        color: var(--green-700);
        font-weight: 700;
        margin-top: 6px;
      }
      details {
        margin-top: 4px;
      }
      @media (max-width: 700px) {
        table.resp td[data-l]::before {
          content: attr(data-l) ": ";
          font-weight: 700;
          color: var(--muted);
          font-size: 12px;
        }
      }
      @media (min-width: 600px) {
        .mood-grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .res-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (min-width: 900px) {
        .who {
          display: inline;
        }
        .shell {
          flex-direction: row;
        }
        .shell nav.bottom {
          order: -1;
        }
        .shell nav.bottom {
          position: sticky;
          top: 0;
          align-self: flex-start;
          height: calc(100vh - 66px);
          width: 210px;
          flex: none;
          grid-template-columns: 1fr;
          grid-auto-rows: min-content;
          gap: 6px;
          border-top: 0;
          border-right: 1px solid var(--line);
          padding: 16px 12px;
        }
        nav.bottom button {
          display: flex;
          align-items: center;
          gap: 12px;
          font-size: 16px;
          padding: 12px 14px;
          text-align: left;
        }
        nav.bottom button span {
          font-size: 22px;
          display: inline;
        }
        main {
          padding: 28px 32px 40px;
        }
        .grid2 {
          grid-template-columns: 1fr 1fr;
          gap: 28px;
          align-items: start;
        }
        .mood-grid {
          grid-template-columns: 1fr 1fr;
        }
        .res-grid {
          grid-template-columns: 1fr 1fr 1fr;
        }
        .menu {
          right: 20px;
        }
      }
      @media (min-width: 1200px) {
        .res-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* ---- v4 additions ---- */
      .bell {
        position: relative;
        background: none;
        border: 0;
        font-size: 22px;
        cursor: pointer;
        padding: 0 4px;
      }
      .badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: var(--red-strong);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        border-radius: 99px;
        padding: 1px 6px;
      }
      .fab {
        position: fixed;
        right: 12px;
        bottom: 84px;
        background: var(--red-strong);
        color: #fff;
        border: 0;
        border-radius: 99px;
        padding: 11px 15px;
        font-weight: 700;
        font-size: 14px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        z-index: 6;
        cursor: pointer;
        font-family: inherit;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }
      .sheet {
        background: #fff;
        border-radius: 18px;
        max-width: 440px;
        width: 100%;
        max-height: 92vh;
        overflow: auto;
        padding: 20px;
        position: relative;
      }
      .sheet .close {
        position: absolute;
        right: 12px;
        top: 10px;
        background: none;
        border: 0;
        font-size: 22px;
        cursor: pointer;
      }
      .pill.ok {
        background: #c9f0d8;
      }
      .pill.gray {
        background: #e4e8e6;
      }
      .nudge.care {
        background: #ffe3e3;
        border-color: #f0a3a3;
      }
      .nudge.ann {
        background: #eaf4ff;
        border-color: #b9d6f2;
      }
      .item.quiz {
        background: #fff4d6;
      }
      .cal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 6px 0;
      }
      .cal-head .btn.small {
        padding: 4px 14px;
        font-size: 18px;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }
      .cal .dow {
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .cal-cell {
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        padding: 0;
        cursor: pointer;
        font-family: inherit;
      }
      .cal-cell.empty {
        border: 0;
        cursor: default;
      }
      .cal-cell span {
        font-size: 16px;
        line-height: 1;
      }
      .cal-cell.today {
        border: 2px solid var(--green-600);
      }
      .cal-cell.sel {
        box-shadow: 0 0 0 3px rgba(46, 157, 95, 0.35);
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 4px;
      }
      .chatbox {
        height: 340px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 10px 0;
      }
      .bub {
        max-width: 80%;
        padding: 8px 12px;
        border-radius: 14px;
        font-size: 15px;
        word-wrap: break-word;
      }
      .bub small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .bub.me {
        align-self: flex-end;
        background: var(--green-100);
      }
      .bub.them {
        align-self: flex-start;
        background: #fff;
        border: 1px solid var(--line);
      }
      .q {
        margin: 16px 0;
      }
      .opts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .opts label {
        font-weight: 500;
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .opts input {
        margin-right: 6px;
      }
      .notif {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin: 8px 0;
        cursor: pointer;
        background: #fff;
      }
      .notif.unread {
        background: #eef9f2;
        border-color: var(--green-600);
      }
      .ctabs {
        margin-bottom: 12px;
      }
      td input[type="text"],
      td input[type="date"],
      td select {
        margin: 4px 0;
      }
      .report {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin: 10px 0;
      }
      @media (min-width: 900px) {
        .fab {
          bottom: 24px;
          right: 24px;
        }
      }
      @media (max-width: 420px) {
        .fab span {
          display: none;
        }
        .fab {
          padding: 12px 14px;
          font-size: 18px;
        }
      }
      @media print {
        .noprint,
        header.top,
        nav.bottom,
        .fab,
        .toast,
        .menu,
        .modal {
          display: none !important;
        }
        main {
          padding: 0 !important;
        }
        body {
          background: #fff;
        }
        .report {
          border: 0;
        }
      }

      .item.exer {
        background: #dff7e8;
      }
      .exbox {
        text-align: center;
        max-width: 520px;
        margin: 10px auto;
      }
      .exicon {
        font-size: 72px;
        line-height: 1.2;
      }
      .exbox .breath {
        transition-property: transform;
      }
      .progress {
        height: 10px;
        background: var(--bg);
        border-radius: 99px;
        overflow: hidden;
        margin: 12px 0;
      }
      .progress i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--green-600);
        transition: width 1s linear;
      }
      .excard .btn.small {
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
      /* Data layer: all data lives in the browser (localStorage). SAMPLE DATA ONLY. */
      const Store = (() => {
        const KEY = "mhwa_prototype_v3";
        const p2 = (n) => String(n).padStart(2, "0");
        const today = (offset = 0) => {
          const d = new Date();
          d.setDate(d.getDate() + offset);
          return (
            d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate())
          );
        };
        const dates = (n) => Array.from({ length: n }, (_, i) => today(-i)); // today first
        const nowIso = () => new Date().toISOString();

        const seed = () => ({
          users: [
            {
              id: "2026-0001",
              name: "Sample Student",
              nickname: "sam",
              role: "student",
              password: "student123",
            },
            {
              id: "2026-0002",
              name: "Juan Sample",
              nickname: "juan",
              role: "student",
              password: "student123",
            },
            {
              id: "2026-0003",
              name: "Maria Sample",
              nickname: "mia",
              role: "student",
              password: "student123",
            },
            {
              id: "clinic01",
              name: "Nurse Sample (Clinic)",
              nickname: "clinic",
              role: "clinic",
              password: "clinic123",
            },
          ],
          moods: [
            {
              id: 1,
              studentId: "2026-0001",
              mood: "Happy",
              date: today(-5),
              notes: "Good day in class",
            },
            {
              id: 2,
              studentId: "2026-0001",
              mood: "Okay",
              date: today(-4),
              notes: "",
            },
            {
              id: 3,
              studentId: "2026-0001",
              mood: "Stressed",
              date: today(-3),
              notes: "Many deadlines",
            },
            {
              id: 4,
              studentId: "2026-0001",
              mood: "Sad",
              date: today(-2),
              notes: "",
            },
            {
              id: 5,
              studentId: "2026-0001",
              mood: "Okay",
              date: today(-1),
              notes: "Felt better after lunch",
            },
            {
              id: 6,
              studentId: "2026-0002",
              mood: "Stressed",
              date: today(-2),
              notes: "",
            },
            {
              id: 7,
              studentId: "2026-0002",
              mood: "Sad",
              date: today(-1),
              notes: "",
            },
            {
              id: 8,
              studentId: "2026-0003",
              mood: "Okay",
              date: today(),
              notes: "",
            },
          ],
          concerns: [
            {
              id: 1,
              code: "MH-1001",
              studentId: null,
              message:
                "I have trouble sleeping because of my thesis and I feel anxious every morning.",
              date: today(-3),
              status: "New",
              response: "",
            },
            {
              id: 2,
              code: "MH-1002",
              studentId: "2026-0002",
              message:
                "I feel overwhelmed with schoolwork and would like to talk to someone.",
              date: today(-2),
              status: "Reviewed",
              response:
                "Thank you for reaching out. Please visit the clinic any weekday so we can talk in private.",
            },
            {
              id: 3,
              code: "MH-1003",
              studentId: null,
              message: "I have been feeling very lonely lately.",
              date: today(-1),
              status: "Needs Follow-up",
              response: "",
            },
          ],
          resources: [
            {
              id: 1,
              title: "Stress Management Tips",
              type: "Tip",
              description:
                "Break big tasks into small steps.\nPlan your day and take short breaks.\nDrink water, eat on time, and sleep 7-8 hours.\nAvoid cramming at night.\nTalk to someone you trust when things feel heavy.",
              contact: "",
            },
            {
              id: 2,
              title: "Deep Breathing Exercise",
              type: "Activity",
              description:
                "Breathe in slowly, then breathe out slowly. Follow the circle below and repeat for one minute.",
              contact: "",
            },
            {
              id: 3,
              title: "Grounding: 5-4-3-2-1",
              type: "Activity",
              description:
                "Name 5 things you can see, 4 you can touch, 3 you can hear, 2 you can smell, and 1 you can taste. This helps calm racing thoughts.",
              contact: "",
            },
            {
              id: 4,
              title: "Mental Wellness Information",
              type: "Information",
              description:
                "Mental wellness means taking care of your emotions, thoughts and relationships. Feeling stressed or sad sometimes is normal. If it lasts for weeks or affects your studies, sleep or appetite, reach out for help. This app does not diagnose; only a licensed professional can.",
              contact: "",
            },
            {
              id: 5,
              title: "Hopeline PH",
              type: "Hotline",
              description: "National mental health hotline.",
              contact: "0919-057-1553",
            },
            {
              id: 6,
              title: "Better Sleep Tips",
              type: "Tip",
              description:
                "Sleep and wake at the same time daily.\nPut your phone away 30 minutes before bed.\nAvoid coffee late in the afternoon.\nKeep your room dark and quiet.\nWrite tomorrow's to-do list so your mind can rest.",
              contact: "",
            },
            {
              id: 7,
              title: "Journaling Prompts",
              type: "Activity",
              description:
                "Write for 5 minutes about one of these:\n- Three things I am grateful for today.\n- Something that stressed me out and what I can control about it.\n- One small thing I did well this week.\n- What I would tell a friend who feels the way I do.",
              contact: "",
            },
            {
              id: 8,
              title: "Healthy Study Habits",
              type: "Tip",
              description:
                "Study in 25-minute blocks with 5-minute breaks.\nStart with the hardest task when you are fresh.\nMake a weekly plan instead of last-minute cramming.\nAsk classmates or teachers for help early.",
              contact: "",
            },
            {
              id: 9,
              title: "When to Reach Out for Help",
              type: "Information",
              description:
                "Consider talking to a professional if, for more than two weeks, you:\n- feel sad, anxious or empty most days\n- cannot sleep or sleep too much\n- lose interest in things you enjoy\n- have trouble focusing on your studies\n- want to avoid people\nIf you feel unsafe or in danger, call the hotline right away.",
              contact: "",
            },
          ],
          checks: {},
          friends: [
            {
              id: 1,
              a: "2026-0003",
              b: "2026-0001",
              status: "accepted",
              share: { "2026-0003": true, "2026-0001": false },
            },
            {
              id: 2,
              a: "2026-0002",
              b: "2026-0001",
              status: "pending",
              share: { "2026-0002": false, "2026-0001": false },
            },
          ],
          messages: [
            {
              id: 1,
              from: "2026-0003",
              to: "2026-0001",
              text: "Hi! How was your day?",
              time: nowIso(),
              read: true,
            },
            {
              id: 2,
              from: "2026-0001",
              to: "2026-0003",
              text: "Tiring but okay. Thanks for asking!",
              time: nowIso(),
              read: true,
            },
          ],
          reports: [],
          appointments: [
            {
              id: 1,
              studentId: "2026-0002",
              date: today(2),
              slot: "10:00 AM",
              reason: "I would like to talk about my school stress.",
              status: "Pending",
              note: "",
            },
            {
              id: 2,
              studentId: "2026-0001",
              date: today(3),
              slot: "2:00 PM",
              reason: "Follow-up chat about sleeping problems.",
              status: "Approved",
              note: "See you at the clinic. Bring your school ID.",
            },
          ],
          announcements: [
            {
              id: 1,
              title: "Wellness Week",
              body: "Join our free relaxation and stress management sessions at the clinic next week.",
              date: today(-1),
            },
            {
              id: 2,
              title: "Clinic hours",
              body: "The clinic is open Monday to Friday, 9:00 AM to 4:00 PM. Walk-ins are welcome.",
              date: today(-4),
            },
          ],
          quiz: {},
          exlog: [],
          gratitude: [],
          notifs: [
            {
              id: 1,
              userId: "2026-0001",
              text: "juan sent you a buddy request",
              go: "buddies",
              date: today(),
              read: false,
            },
            {
              id: 2,
              userId: "clinic01",
              text: "New appointment request from Juan Sample",
              go: "appointments",
              date: today(),
              read: false,
            },
          ],
          nextId: {
            mood: 9,
            concern: 4,
            friend: 3,
            msg: 3,
            appt: 3,
            ann: 3,
            notif: 3,
            report: 1,
            ex: 1,
            grat: 1,
          },
          session: null,
        });

        let db;
        const save = () => {
          try {
            localStorage.setItem(KEY, JSON.stringify(db));
          } catch (e) {
            /* storage blocked */
          }
        };
        const load = () => {
          try {
            db = JSON.parse(localStorage.getItem(KEY));
          } catch (e) {
            db = null;
          }
          if (!db) {
            db = seed();
            save();
          }
          db.exlog = db.exlog || [];
          db.gratitude = db.gratitude || [];
          db.nextId.ex = db.nextId.ex || 1;
          db.nextId.grat = db.nextId.grat || 1;
        };
        load();

        const user = (id) => db.users.find((x) => x.id === id);
        const nick = (id) => {
          const u = user(id);
          return u ? u.nickname : id;
        };
        const nid = (k) => db.nextId[k]++;
        const notify = (userId, text, go) => {
          db.notifs.push({
            id: nid("notif"),
            userId,
            text,
            go,
            date: today(),
            read: false,
          });
        };
        const notifyClinic = (text, go) =>
          db.users
            .filter((u) => u.role === "clinic")
            .forEach((u) => notify(u.id, text, go));
        const relation = (a, b) =>
          db.friends.find(
            (f) => (f.a === a && f.b === b) || (f.a === b && f.b === a),
          ) || null;

        return {
          today,
          user,
          nick,
          login(id, password) {
            const u = db.users.find(
              (x) =>
                x.id.toLowerCase() === id.trim().toLowerCase() &&
                x.password === password,
            );
            if (!u) return null;
            db.session = { id: u.id, name: u.name, role: u.role };
            save();
            return db.session;
          },
          register(id, name, password, nickname) {
            id = id.trim();
            name = name.trim();
            nickname = nickname.trim();
            if (!/^[A-Za-z0-9_]{2,15}$/.test(nickname))
              return "Nickname must be 2-15 letters, numbers or underscore (no spaces).";
            if (db.users.some((x) => x.id.toLowerCase() === id.toLowerCase()))
              return "That Student ID is already registered.";
            if (
              db.users.some(
                (x) => x.nickname.toLowerCase() === nickname.toLowerCase(),
              )
            )
              return "That nickname is already taken. Please choose another.";
            db.users.push({ id, name, nickname, role: "student", password });
            save();
            return null;
          },
          logout() {
            db.session = null;
            save();
          },
          session() {
            return db.session;
          },
          reset() {
            db = seed();
            save();
          },

          // Student Moods
          saveMood(studentId, mood, notes) {
            const date = today();
            const existing = db.moods.find(
              (m) => m.studentId === studentId && m.date === date,
            );
            if (existing) {
              existing.mood = mood;
              existing.notes = notes;
            } else
              db.moods.push({ id: nid("mood"), studentId, mood, date, notes });
            save();
            return !!existing;
          },
          moodsFor(studentId) {
            return db.moods
              .filter((m) => m.studentId === studentId)
              .sort((a, b) => b.date.localeCompare(a.date));
          },
          todayMood(studentId) {
            return db.moods.find(
              (m) => m.studentId === studentId && m.date === today(),
            );
          },
          streak(studentId) {
            const have = new Set(
              db.moods
                .filter((m) => m.studentId === studentId)
                .map((m) => m.date),
            );
            let i = have.has(today()) ? 0 : 1,
              n = 0;
            while (have.has(today(-i))) {
              n++;
              i++;
            }
            return n;
          },
          moodCounts(studentId, days) {
            const set = new Set(dates(days)),
              c = { Happy: 0, Okay: 0, Sad: 0, Stressed: 0 };
            db.moods
              .filter((m) => m.studentId === studentId && set.has(m.date))
              .forEach((m) => c[m.mood]++);
            return c;
          },
          lowMoodRun(studentId) {
            return [0, 1, 2].every((i) => {
              const m = db.moods.find(
                (x) => x.studentId === studentId && x.date === today(-i),
              );
              return m && (m.mood === "Sad" || m.mood === "Stressed");
            });
          },
          overview(days) {
            const set = new Set(dates(days)),
              c = { Happy: 0, Okay: 0, Sad: 0, Stressed: 0 };
            db.moods.filter((m) => set.has(m.date)).forEach((m) => c[m.mood]++);
            return c;
          },
          weekly(studentId) {
            const days = dates(7).reverse();
            const entries = days.map(
              (d) =>
                db.moods.find(
                  (m) => m.studentId === studentId && m.date === d,
                ) || null,
            );
            const care = days.map(
              (d) => (db.checks[studentId + "|" + d] || []).length,
            );
            return {
              days,
              entries,
              counts: this.moodCounts(studentId, 7),
              checkins: entries.filter(Boolean).length,
              exercises: this.exerciseStats(studentId).week,
              careDays: care.filter((n) => n > 0).length,
              careItems: care.reduce((a, b) => a + b, 0),
            };
          },

          // Self-care checklist
          checks(studentId) {
            return db.checks[studentId + "|" + today()] || [];
          },
          toggleCheck(studentId, key) {
            const k = studentId + "|" + today(),
              cur = db.checks[k] || [];
            db.checks[k] = cur.includes(key)
              ? cur.filter((x) => x !== key)
              : cur.concat(key);
            save();
          },

          // Mental Health Concerns
          addConcern(studentId, message, anonymous) {
            let code;
            do {
              code = "MH-" + (1000 + Math.floor(Math.random() * 9000));
            } while (db.concerns.some((c) => c.code === code));
            db.concerns.push({
              id: nid("concern"),
              code,
              studentId: anonymous ? null : studentId,
              message,
              date: today(),
              status: "New",
              response: "",
            });
            notifyClinic("New concern submitted (" + code + ")", "concerns");
            save();
            return code;
          },
          concerns() {
            return db.concerns.slice().sort((a, b) => b.id - a.id);
          },
          myConcerns(studentId) {
            return db.concerns
              .filter((c) => c.studentId === studentId)
              .sort((a, b) => b.id - a.id);
          },
          byCode(code) {
            return (
              db.concerns.find(
                (c) => c.code.toLowerCase() === code.trim().toLowerCase(),
              ) || null
            );
          },
          setStatus(id, status) {
            const c = db.concerns.find((x) => x.id === id);
            if (c) {
              c.status = status;
              save();
            }
          },
          respond(id, text) {
            const c = db.concerns.find((x) => x.id === id);
            if (!c) return;
            c.response = text;
            if (c.status === "New") c.status = "Reviewed";
            if (c.studentId)
              notify(
                c.studentId,
                "The clinic replied to your concern " + c.code,
                "concerns",
              );
            save();
          },
          studentName(id) {
            const u = user(id);
            return u ? u.name : id;
          },

          // Wellness Resources
          resources() {
            return db.resources;
          },

          // Buddies
          search(me, q) {
            q = q.trim().toLowerCase();
            if (!q) return [];
            return db.users
              .filter(
                (u) =>
                  u.role === "student" &&
                  u.id !== me &&
                  (u.nickname.toLowerCase().includes(q) ||
                    u.id.toLowerCase() === q),
              )
              .slice(0, 8);
          },
          relation,
          sendRequest(me, other) {
            if (relation(me, other))
              return "You already have a request or buddy with this person.";
            db.friends.push({
              id: nid("friend"),
              a: me,
              b: other,
              status: "pending",
              share: { [me]: false, [other]: false },
            });
            notify(other, nick(me) + " sent you a buddy request", "buddies");
            save();
            return null;
          },
          respondRequest(frId, accept) {
            const f = db.friends.find((x) => x.id === frId);
            if (!f) return;
            if (accept) {
              f.status = "accepted";
              notify(
                f.a,
                nick(f.b) + " accepted your buddy request",
                "buddies",
              );
            } else db.friends = db.friends.filter((x) => x.id !== frId);
            save();
          },
          removeBuddy(frId) {
            const f = db.friends.find((x) => x.id === frId);
            if (!f) return;
            db.messages = db.messages.filter(
              (m) =>
                !(
                  (m.from === f.a && m.to === f.b) ||
                  (m.from === f.b && m.to === f.a)
                ),
            );
            db.friends = db.friends.filter((x) => x.id !== frId);
            save();
          },
          setShare(frId, me, val) {
            const f = db.friends.find((x) => x.id === frId);
            if (f) {
              f.share[me] = !!val;
              save();
            }
          },
          buddies(me) {
            return db.friends
              .filter(
                (f) => f.status === "accepted" && (f.a === me || f.b === me),
              )
              .map((f) => ({ fr: f, other: user(f.a === me ? f.b : f.a) }));
          },
          incoming(me) {
            return db.friends
              .filter((f) => f.status === "pending" && f.b === me)
              .map((f) => ({ fr: f, other: user(f.a) }));
          },
          outgoing(me) {
            return db.friends
              .filter((f) => f.status === "pending" && f.a === me)
              .map((f) => ({ fr: f, other: user(f.b) }));
          },
          buddyMood(me, other) {
            // visible only if the buddy chose to share
            const f = relation(me, other);
            if (!f || f.status !== "accepted") return { shared: false };
            if (!f.share[other]) return { shared: false };
            return { shared: true, mood: this.todayMood(other) || null };
          },
          messagesBetween(a, b) {
            return db.messages.filter(
              (m) =>
                (m.from === a && m.to === b) || (m.from === b && m.to === a),
            );
          },
          sendMessage(from, to, text) {
            db.messages.push({
              id: nid("msg"),
              from,
              to,
              text,
              time: nowIso(),
              read: false,
            });
            notify(to, "New message from " + nick(from), "buddies");
            save();
          },
          unreadFrom(me, other) {
            return db.messages.filter(
              (m) => m.to === me && m.from === other && !m.read,
            ).length;
          },
          markRead(me, other) {
            db.messages.forEach((m) => {
              if (m.to === me && m.from === other) m.read = true;
            });
            save();
          },
          report(me, other) {
            db.reports.push({
              id: nid("report"),
              reporter: me,
              reported: other,
              date: today(),
            });
            notifyClinic(
              "A buddy chat was reported: " +
                nick(me) +
                " reported " +
                nick(other),
              "concerns",
            );
            save();
          },

          // Appointments
          addAppointment(studentId, date, slot, reason) {
            db.appointments.push({
              id: nid("appt"),
              studentId,
              date,
              slot,
              reason,
              status: "Pending",
              note: "",
            });
            notifyClinic(
              "New appointment request from " + this.studentName(studentId),
              "appointments",
            );
            save();
          },
          appointmentsFor(sid) {
            return db.appointments
              .filter((a) => a.studentId === sid)
              .sort((a, b) => (b.date + b.slot).localeCompare(a.date + a.slot));
          },
          allAppointments() {
            return db.appointments
              .slice()
              .sort((a, b) => a.date.localeCompare(b.date) || b.id - a.id);
          },
          slotTaken(date, slot, exceptId) {
            return db.appointments.some(
              (a) =>
                a.id !== exceptId &&
                a.date === date &&
                a.slot === slot &&
                (a.status === "Approved" || a.status === "Rescheduled"),
            );
          },
          updateAppointment(id, patch) {
            const a = db.appointments.find((x) => x.id === id);
            if (!a) return;
            Object.assign(a, patch);
            if (patch.status && patch.status !== "Cancelled")
              notify(
                a.studentId,
                "Your appointment was " +
                  patch.status.toLowerCase() +
                  " (" +
                  a.date +
                  ", " +
                  a.slot +
                  ")",
                "visits",
              );
            save();
          },

          // Announcements
          announcements() {
            return db.announcements.slice().sort((a, b) => b.id - a.id);
          },
          addAnnouncement(title, body) {
            db.announcements.push({
              id: nid("ann"),
              title,
              body,
              date: today(),
            });
            db.users
              .filter((u) => u.role === "student")
              .forEach((u) =>
                notify(u.id, "New announcement: " + title, "home"),
              );
            save();
          },
          deleteAnnouncement(id) {
            db.announcements = db.announcements.filter((a) => a.id !== id);
            save();
          },

          // Notifications
          notifsFor(uid) {
            return db.notifs
              .filter((n) => n.userId === uid)
              .sort((a, b) => b.id - a.id);
          },
          unread(uid) {
            return db.notifs.filter((n) => n.userId === uid && !n.read).length;
          },
          markNotif(id) {
            const n = db.notifs.find((x) => x.id === id);
            if (n) {
              n.read = true;
              save();
            }
          },
          markAllNotifs(uid) {
            db.notifs.forEach((n) => {
              if (n.userId === uid) n.read = true;
            });
            save();
          },

          // Wellness exercises
          logExercise(sid, exId, title, mins) {
            db.exlog.push({
              id: nid("ex"),
              studentId: sid,
              exId,
              title,
              mins,
              date: today(),
            });
            save();
          },
          exerciseStats(sid) {
            const wk = new Set(dates(7)),
              mine = db.exlog.filter((e) => e.studentId === sid),
              w = mine.filter((e) => wk.has(e.date));
            return {
              today: mine.filter((e) => e.date === today()).length,
              week: w.length,
              minutes: w.reduce((a, e) => a + e.mins, 0),
              total: mine.length,
            };
          },
          recentExercises(sid, n) {
            return db.exlog
              .filter((e) => e.studentId === sid)
              .sort((a, b) => b.id - a.id)
              .slice(0, n);
          },
          addGratitude(sid, items) {
            db.gratitude.push({
              id: nid("grat"),
              studentId: sid,
              date: today(),
              items,
            });
            save();
          },
          gratitudeFor(sid) {
            return db.gratitude

        Store.moodsFor(user.id).forEach((m) => (map[m.date] = m));
        const startDow = new Date(calY, calM, 1).getDay(),
          days = new Date(calY, calM + 1, 0).getDate();
        const title = new Date(calY, calM, 1).toLocaleDateString("en", {
          month: "long",
          year: "numeric",
        });
        let cells = "";
        for (let i = 0; i < startDow; i++)
          cells += '<div class="cal-cell empty"></div>';
        for (let d = 1; d <= days; d++) {
          const ds = calY + "-" + p2(calM + 1) + "-" + p2(d),
            m = map[ds];
          cells += `<button class="cal-cell ${ds === Store.today() ? "today" : ""} ${calSel === ds ? "sel" : ""}" data-day="${ds}" style="${m ? "background:" + MOOD_COLOR[m.mood] + "88" : ""}"><b>${d}</b>${m ? "<span>" + MOOD_EM[m.mood] + "</span>" : ""}</button>`;
        }
        const sel = calSel && map[calSel];
        return `<div class="cal-head"><button class="btn small ghost" id="calPrev" aria-label="Previous month">‹</button><b>${title}</b><button class="btn small ghost" id="calNext" aria-label="Next month">›</button></div>
  <div class="cal"><div class="dow">S</div><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div>${cells}</div>
  <div class="legend">${MOODS.map((m) => `<span><i style="background:${MOOD_COLOR[m.name]}"></i>${m.name}</span>`).join("")}</div>
  ${calSel ? `<div class="card" style="margin-top:10px">${sel ? `${MOOD_EM[sel.mood]} <b>${esc(sel.mood)}</b> · ${fmt(calSel)}<br><span class="muted">${sel.notes ? esc(sel.notes) : "No note"}</span>` : `<span class="muted">${fmt(calSel)}: no check-in</span>`}</div>` : ""}`;
      }
      function weeklyReport(user) {
        const w = Store.weekly(user.id),
          tot = w.checkins;
        const score = { Happy: 4, Okay: 3, Sad: 2, Stressed: 1 };
        const avg = tot
          ? w.entries.filter(Boolean).reduce((a, e) => a + score[e.mood], 0) /
            tot
          : 0;
        const msg = !tot
          ? "No check-ins this week yet. Try saving your mood each day."
          : avg >= 3.3
            ? "It looks like a good week. Keep up the habits that help you feel well."
            : avg >= 2.3
              ? "A mixed week. Small breaks and talking to someone you trust can help."
              : "This week looked tough. You do not have to handle it alone. Consider talking to the clinic.";
        const top = tot
          ? Object.keys(w.counts).sort((a, b) => w.counts[b] - w.counts[a])[0]
          : "-";
        return `<button class="back noprint" id="repBack">← Back</button>
  <div class="report"><h2>Weekly Wellness Report</h2><p class="muted">${esc(user.name)} · ${fmt(w.days[0])} to ${fmt(w.days[6])}</p>
  <div class="stats"><div class="stat"><b>${w.checkins}/7</b>Days checked in</div><div class="stat"><b>${w.careDays}/7</b>Self-care days</div><div class="stat"><b>${w.exercises}</b>Exercises done</div><div class="stat"><b>${top === "-" ? "-" : MOOD_EM[top] + " " + top}</b>Most common mood</div></div>
  ${MOODS.map((m) => `<div class="hbar"><span>${m.em} ${m.name}</span><div><i style="width:${tot ? (w.counts[m.name] / tot) * 100 : 0}%;background:${MOOD_COLOR[m.name]}"></i></div><b>${w.counts[m.name]}</b></div>`).join("")}
  <div class="nudge ok" style="margin-top:14px">${msg}</div>
  <p class="muted">This report is for self-awareness only. It is not a diagnosis. Generated on ${fmt(Store.today())}.</p></div>
  <button class="btn noprint" id="printBtn">🖨️ Print / Save as PDF</button>`;
      }
      function studentMood(user) {
        if (showReport) {
          studentShell(user, weeklyReport(user));
          document.getElementById("repBack").onclick = () => {
            showReport = false;
            render();
          };
          document.getElementById("printBtn").onclick = () => window.print();
          return;
        }
        const all = Store.moodsFor(user.id);
        const score = { Happy: 4, Okay: 3, Sad: 2, Stressed: 1 };
        const last7 = [];
        for (let i = 6; i >= 0; i--) {
          const d = Store.today(-i);
          last7.push({ d, m: all.find((x) => x.date === d) });

        const counts = Store.moodCounts(user.id, 30),
          total = Object.values(counts).reduce((a, b) => a + b, 0);
        const top = total
          ? Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0]
          : "-";
        studentShell(
          user,
          `<h2>My Mood History</h2><p class="sub">Only you can see this page.</p>
  <div class="stats"><div class="stat"><b>${Store.streak(user.id)}</b>Day streak</div><div class="stat"><b>${total}</b>Check-ins (30 days)</div><div class="stat"><b>${top === "-" ? "-" : MOOD_EM[top] + " " + top}</b>Most common mood</div></div>
  <button class="btn ghost" id="repBtn" style="margin-top:0">📄 View weekly report</button>
  <div class="grid2"><section><h3>Mood calendar</h3>${calendarHtml(user)}
  <h3>Last 7 days</h3><div class="bars-wrap"><div class="bars">${last7.map((x) => `<div style="height:${x.m ? score[x.m.mood] * 25 : 6}%;background:${x.m ? MOOD_COLOR[x.m.mood] : "#e3ebe7"}" title="${x.m ? x.m.mood : "No entry"}"><small>${new Date(x.d + "T00:00:00").toLocaleDateString("en", { weekday: "short" })}</small></div>`).join("")}</div></div>
  </section><section><h3>Last 30 days</h3>${MOODS.map((m) => `<div class="hbar"><span>${m.em} ${m.name}</span><div><i style="width:${total ? (counts[m.name] / total) * 100 : 0}%;background:${MOOD_COLOR[m.name]}"></i></div><b>${counts[m.name]}</b></div>`).join("")}
  <h3>History</h3><div class="card">${all.length ? all.map((m) => `<div class="list-row"><span class="em">${MOOD_EM[m.mood]}</span><div><b>${esc(m.mood)}</b> · ${fmt(m.date)}<br><span class="muted">${m.notes ? esc(m.notes) : "No note"}</span></div></div>`).join("") : '<p class="muted">No mood entries yet. Save one on the Home tab.</p>'}</div></section></div>`,
        );
        document.getElementById("repBtn").onclick = () => {
          showReport = true;
          render();
          window.scrollTo(0, 0);
        };
        const shift = (d) => {
          calM += d;
          if (calM < 0) {
            calM = 11;
            calY--;
          }
          if (calM > 11) {
            calM = 0;
            calY++;
          }
          render();
        };
        document.getElementById("calPrev").onclick = () => shift(-1);
        document.getElementById("calNext").onclick = () => shift(1);
        document.querySelectorAll("[data-day]").forEach(
          (b) =>
            (b.onclick = () => {
              calSel = b.dataset.day;
              render();
            }),
        );
      }

        const results = buddyQuery ? Store.search(user.id, buddyQuery) : null;

          const f = Store.relation(user.id, id);
          return !f ? null : f.status === "accepted" ? "Buddy" : "Requested";
        };
        studentShell(
          user,
          `<h2>My Buddies</h2><p class="sub">Add a friend by nickname. You choose if they can see your mood.</p>
  <div class="grid2"><section>
    <div class="card"><b>➕ Add a buddy</b><div class="row"><input type="text" id="bq" placeholder="Search nickname or Student ID" value="${esc(buddyQuery)}"><button class="btn small" id="bqBtn">Search</button></div>
    ${results ? (results.length ? results.map((r) => `<div class="list-row"><span class="em">🙂</span><div style="flex:1"><b>@${esc(r.nickname)}</b></div>${relText(r.id) ? `<span class="pill rev">${relText(r.id)}</span>` : `<button class="btn small" data-add="${r.id}">Add</button>`}</div>`).join("") : '<p class="muted">No student found.</p>') : ""}</div>
    ${inc.length ? `<h3>Buddy requests</h3>${inc.map((r) => `<div class="card"><b>@${esc(r.other.nickname)}</b> wants to be your buddy<div class="row"><button class="btn small" data-acc="${r.fr.id}">Accept</button><button class="btn small ghost" data-dec="${r.fr.id}">Decline</button></div></div>`).join("")}` : ""}
    ${out.length ? `<h3>Sent requests</h3>${out.map((r) => `<div class="card">Waiting for <b>@${esc(r.other.nickname)}</b> ${statusPill("Pending")}</div>`).join("")}` : ""}
  </section><section><h3>Buddies (${bud.length})</h3>
    ${
      bud.length
        ? bud
            .map((b) => {
              const bm = Store.buddyMood(user.id, b.other.id),
                un = Store.unreadFrom(user.id, b.other.id);

              return `<div class="card"><b>🙂 @${esc(b.other.nickname)}</b><br><span class="muted">${moodTxt}</span>
      <label class="check small"><input type="checkbox" data-share="${b.fr.id}" ${b.fr.share[user.id] ? "checked" : ""}> Share my mood with @${esc(b.other.nickname)}</label>
      <div class="row"><button class="btn small" data-chat="${b.other.id}">💬 Chat${un ? " (" + un + " new)" : ""}</button><button class="btn small ghost" data-rm="${b.fr.id}">Remove</button></div></div>`;
            })
            .join("")
        : '<p class="muted">No buddies yet. Search for a friend by nickname.</p>'
    }
    <p class="muted">Buddies only see your mood label for today, never your notes. The clinic cannot read buddy chats.</p>
  </section></div>`,
        );

          render();

        document.querySelectorAll("[data-add]").forEach(
          (b) =>
            (b.onclick = () => {
              const m = Store.sendRequest(user.id, b.dataset.add);
              toast(m || "Buddy request sent");
              render();
            }),
        );
        document.querySelectorAll("[data-acc]").forEach(
          (b) =>
            (b.onclick = () => {

              toast("Buddy added");
              render();

        document.querySelectorAll("[data-dec]").forEach(

              render();
            }),

      function studentChat(user) {

        }
        Store.markRead(user.id, openChat);
        const msgs = Store.messagesBetween(user.id, openChat);
        studentShell(
          user,
          `<button class="back" id="back">← Back</button><h2>Chat with @${esc(other.nickname)}</h2>

  <div class="chatbox" id="chatbox">${msgs.length ? msgs.map((m) => `<div class="bub ${m.from === user.id ? "me" : "them"}">${esc(m.text)}<small>${fmtTime(m.time)}</small></div>`).join("") : '<p class="muted" style="margin:auto">Say hi 👋</p>'}</div>

        chatAlert = false;
        const box = document.getElementById("chatbox");

          openChat = null;
          render();
        };
        const send = () => {
          const inp = document.getElementById("chatIn"),
            text = inp.value.trim();

          render();
        };
        document.getElementById("sendBtn").onclick = send;
        document.getElementById("chatIn").onkeydown = (e) => {
          if (e.key === "Enter") send();

            (a.onclick = (e) => {
              e.preventDefault();
              go(a.dataset.go);

          if (confirm("Report this chat to the clinic?")) {
            Store.report(user.id, openChat);
            toast("Reported. Thank you for keeping the community safe.");
          }
        };
      }
